[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "authlog-hunter"
version = "0.1.0"
description = "Detect SSH brute force, account compromise and post-exploitation activity in Linux auth logs, mapped to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["security", "blue-team", "dfir", "ssh", "brute-force", "auth.log", "mitre-attack", "threat-hunting", "log-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.scripts]
authlog-hunter = "authlog_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
